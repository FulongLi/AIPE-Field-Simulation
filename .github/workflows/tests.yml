name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  unit:
    name: unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    env:
      AIPE_REQUIRE_GMSH: '1'  # mesh-marked tests must execute, not skip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: System libraries for the Gmsh wheel (libGLU, X11 client libraries)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglu1-mesa libxcursor1 libxft2 libxinerama1 libxrender1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,mesh,plots]
      - name: Analytic benchmarks, SIF/VTU/SaveData parsing, manifest, Gmsh geometry (solver-marked tests deselected here)
        run: python -m pytest -q -ra -m "not solver" --junitxml=pytest-unit.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pytest-unit-py${{ matrix.python-version }}
          path: pytest-unit.xml
          if-no-files-found: ignore

  solver:
    name: executed Gmsh + Elmer solver tests and examples
    # Elmer FEM is not in the Ubuntu archive; the ElmerCSC PPA (package elmerfem-csc 9.0-0ppa..., binaries report
    # v26.2) publishes builds for the LTS releases up to 24.04 (noble) but not for 26.04, which ubuntu-latest
    # now resolves to. Pin the image.
    runs-on: ubuntu-24.04
    env:
      AIPE_REQUIRE_SOLVER: '1'  # a missing ElmerSolver/ElmerGrid/gmsh fails the job instead of skipping
      AIPE_REQUIRE_GMSH: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Elmer FEM (ElmerCSC PPA) and the Gmsh wheel's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common \
            libglu1-mesa libxcursor1 libxft2 libxinerama1 libxrender1
          sudo add-apt-repository -y ppa:elmer-csc-ubuntu/elmer-csc-ppa
          sudo apt-get update
          sudo apt-get install -y elmerfem-csc
          which ElmerSolver ElmerGrid
      - name: Install the package with the Gmsh SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,mesh,plots]
      - name: Tool report and known-answer qualification (Gmsh mesh, Elmer slab T_max = 305 K)
        run: aipe-fieldsim doctor --qualify runs/qualify
      - name: Solver-marked tests (must execute, not skip)
        run: |
          python -m pytest -q -ra -m solver --junitxml=pytest-solver.xml
          python - <<'EOF'
          import xml.etree.ElementTree as ET
          root = ET.parse("pytest-solver.xml").getroot()
          suite = root if root.tag == "testsuite" else root[0]
          tests, skipped = int(suite.get("tests", 0)), int(suite.get("skipped", 0))
          print(f"solver tests: {tests} collected, {skipped} skipped")
          assert tests > 0 and skipped == 0, "solver tests must execute when Elmer is installed"
          EOF
      - name: Heat-sink example end to end (inputs -> Gmsh -> Elmer -> checks -> figures, exits non-zero on a failed check)
        run: python examples/heatsink_to247/run_example.py --out runs/example-heatsink --curate runs/example-heatsink-results
      - name: 10 kW DAB heat sink from the AIPE-CAD-Agent STEP model (CAD -> Gmsh -> Elmer -> electrothermal T_j -> figures)
        run: python examples/dab_10kw_heatsink/run_example.py --out runs/example-dab --curate runs/example-dab-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pytest-solver
          path: |
            pytest-solver.xml
            runs/qualify/tool-manifest.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: heatsink-example-results
          path: runs/example-heatsink-results
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dab-heatsink-example-results
          path: runs/example-dab-results
          if-no-files-found: ignore
