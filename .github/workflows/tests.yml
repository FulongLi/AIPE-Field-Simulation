name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  unit:
    name: unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,mesh,plots]
      - name: Analytic benchmarks, SIF/VTU/SaveData parsing, manifest, meshing (solver-marked tests deselected here)
        run: python -m pytest -q -ra -m "not solver" --junitxml=pytest-unit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-unit-py${{ matrix.python-version }}
          path: pytest-unit.xml
          if-no-files-found: ignore

  solver:
    name: executed Gmsh + Elmer solver tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the package with the Gmsh SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev,mesh,plots]
      - name: Install Elmer FEM from the Ubuntu archive
        id: elmer
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y elmerfem-csc
          which ElmerSolver ElmerGrid
      - name: Tool report
        run: aipe-fieldsim doctor || python -c "from aipe_fieldsim.tools import qualify_all; print(qualify_all())"
      - name: Solver-marked tests (must execute, not skip, when Elmer installed)
        if: steps.elmer.outcome == 'success'
        run: |
          python -m pytest -q -ra -m solver --junitxml=pytest-solver.xml
          python - <<'EOF'
          import xml.etree.ElementTree as ET
          root = ET.parse("pytest-solver.xml").getroot()
          suite = root if root.tag == "testsuite" else root[0]
          tests, skipped = int(suite.get("tests", 0)), int(suite.get("skipped", 0))
          print(f"solver tests: {tests} collected, {skipped} skipped")
          assert tests > 0 and skipped == 0, "solver tests must execute when Elmer is installed"
          EOF
      - name: Elmer unavailable on this runner
        if: steps.elmer.outcome != 'success'
        run: |
          echo "::warning::Elmer FEM could not be installed from the Ubuntu archive; the executed solver tests did NOT run here."
          echo "See results/benchmarks.md for the last validated local execution (Elmer 9.0, Gmsh 4.15.2, Windows 11)."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-solver
          path: pytest-solver.xml
          if-no-files-found: ignore
