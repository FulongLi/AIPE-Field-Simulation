[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aipe-fieldsim"
version = "0.1.0"
description = "Reproducible Gmsh + Elmer FEM field-simulation workflows (thermal, magnetostatic, eddy-current) with analytic benchmarks and AIPE evidence records."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "AIPE contributors"}]
keywords = ["finite-element", "elmer", "gmsh", "power-electronics", "thermal", "magnetics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
mesh = ["gmsh>=4.11"]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7", "pyyaml>=6", "jsonschema>=4"]

[project.scripts]
aipe-fieldsim = "aipe_fieldsim.cli:main"

[project.urls]
Repository = "https://github.com/FulongLi/AIPE-Field-Simulation"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "solver: executes Gmsh/ElmerGrid/ElmerSolver (skipped when the tools are missing unless AIPE_REQUIRE_SOLVER=1)",
  "mesh: executes the Gmsh python SDK only (skipped when gmsh is missing unless AIPE_REQUIRE_GMSH=1)",
]
addopts = "-ra"
